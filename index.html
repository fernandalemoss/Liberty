<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liberty Perfumaria</title>
  <link rel="icon" type="image/x-icon" href="scent1_41670.ico">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>

<header>
  <div class="logo"><a href="index.html">Liberty Perfumaria</a></div>
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="feminino.html">Feminino</a>
    <a href="masculino.html">Masculino</a>
    <a href="kits.html">Kits</a>
    <a href="sobrenos.html">Sobre Nós</a>
    <a id="link-acesso" href="login-cliente.html" class="link-entrar">Entrar</a>
  </nav>
</header>

<section class="banner banner-inicial">
  <div class="conteudo-banner">
    <h2>Realce sua essência</h2>
    <p>Perfumes sofisticados para todos os momentos</p>
    <a href="https://wa.me/5599999999999?text=Olá!%20Gostaria%20de%20mais%20informações."
       class="btn-banner" target="_blank" rel="noopener noreferrer">
      Falar no WhatsApp
    </a>
  </div>
</section>

<section class="produtos">
  <div class="secao-header">
    <div class="secao-header-left">
      <h2>Nossos Perfumes</h2>
      <p id="subtitulo-contagem">Carregando...</p>
    </div>
    <div class="filtros" id="filtros">
      <button class="btn-filtro ativo" onclick="filtrar(null, this)">Todos</button>
    </div>
  </div>
  <div class="grid" id="grid-produtos">
    <div class="grid-status"><p>Carregando perfumes...</p></div>
  </div>
</section>

<footer>
  <span class="logo-footer">Liberty</span>
  <p>© 2025 Liberty Perfumaria · Divinópolis, MG</p>
</footer>

<div id="toast"></div>
<script src="favoritar.js"></script>

<script>
  let todosProdutos = [];
  let categoriaAtiva = null;

  async function carregarProdutos() {
    const { data, error } = await db
      .from('produtos')
      .select('id, nome, descricao, preco, imagem, categorias(nome)')
      .eq('ativo', true)
      .order('criado_em', { ascending: false });

    const grid = document.getElementById('grid-produtos');

    if (error || !data) {
      grid.innerHTML = '<div class="grid-status"><p>Erro ao carregar produtos.</p></div>';
      return;
    }

    todosProdutos = data;

    // Monta filtros de categoria
    const cats = [...new Set(data.map(p => p.categorias?.nome).filter(Boolean))];
    const filtrosEl = document.getElementById('filtros');
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'btn-filtro';
      btn.textContent = cat;
      btn.onclick = () => filtrar(cat, btn);
      filtrosEl.appendChild(btn);
    });

    renderizarProdutos(data);
  }

  function filtrar(categoria, btnClicado) {
    categoriaAtiva = categoria;
    document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
    btnClicado.classList.add('ativo');
    const filtrados = categoria
      ? todosProdutos.filter(p => p.categorias?.nome === categoria)
      : todosProdutos;
    renderizarProdutos(filtrados);
  }

  function renderizarProdutos(produtos) {
    const grid = document.getElementById('grid-produtos');
    const subtitulo = document.getElementById('subtitulo-contagem');

    subtitulo.textContent = `${produtos.length} perfume${produtos.length !== 1 ? 's' : ''} disponíve${produtos.length !== 1 ? 'is' : 'l'}`;

    if (produtos.length === 0) {
      grid.innerHTML = '<div class="grid-status"><p>Nenhum produto encontrado.</p></div>';
      return;
    }

    const waBase = 'https://wa.me/5599999999999?text=';

    grid.innerHTML = produtos.map(p => {
      const precoFmt = 'R$ ' + Number(p.preco).toFixed(2).replace('.', ',');
      const waLink   = waBase + encodeURIComponent(`Olá! Tenho interesse no perfume ${p.nome}.`);
      const catNome  = p.categorias?.nome || '';

      return `
        <div class="card">
          <div class="card-img-wrap">
            ${catNome ? `<span class="card-badge">${catNome}</span>` : ''}
            <img src="${p.imagem || ''}" alt="${p.nome}"
              onerror="this.style.display='none'">
          </div>
          <div class="card-info">
            <h3>${p.nome}</h3>
            <p class="desc">${p.descricao || ''}</p>
          </div>
          <div class="preco-row">
            <span class="preco">${precoFmt}</span>
            <button
              class="btn-fav"
              id="fav-${p.id}"
              onclick="toggleFav(this, ${p.id})"
              title="Favoritar">
              <svg viewBox="0 0 24 24">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
          </div>
          <a href="${waLink}" class="card-comprar" target="_blank" rel="noopener noreferrer">
            Comprar via WhatsApp
          </a>
        </div>`;
    }).join('');

    // Remark favoritos após renderizar
    marcarFavoritos();
  }

  carregarProdutos();
</script>

</body>
</html>
