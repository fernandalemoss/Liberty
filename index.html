<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liberty Perfumaria</title>
  <link rel="icon" type="image/x-icon" href="scent1_41670.ico">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>

<div id="header-root"></div>
<script src="header.js"></script>

<!-- BANNER — troca conforme filtro -->
<section class="banner" id="banner-principal" style="background-image:url('Inicio.png')">
  <div class="conteudo-banner">
    <h2 id="banner-titulo">Realce sua essência</h2>
    <p id="banner-sub">Perfumes sofisticados para todos os momentos</p>
    <a href="https://wa.me/5599999999999?text=Olá!%20Gostaria%20de%20mais%20informações."
       class="btn-banner" target="_blank" rel="noopener noreferrer">
      Falar no WhatsApp
    </a>
  </div>
</section>

<section class="produtos">
  <div class="secao-header">
    <div class="secao-header-left">
      <h2>Nossos Perfumes</h2>
      <p id="subtitulo-contagem">Carregando...</p>
    </div>
    <div class="filtros-wrap">
      <div class="filtros-cats" id="filtros-cats">
        <button class="btn-filtro ativo" onclick="filtrarCategoria(null, this)">Todos</button>
      </div>
      <div class="filtros-subcats" id="filtros-subcats"></div>
    </div>
  </div>
  <div class="grid" id="grid-produtos">
    <div class="grid-status"><p>Carregando perfumes...</p></div>
  </div>
</section>

<footer>
  <span class="logo-footer">Liberty</span>
  <p>© 2025 Liberty Perfumaria · Divinópolis, MG</p>
</footer>

<div id="toast"></div>
<script src="favoritar.js"></script>
<script src="produto-modal.js"></script>

<script>
  let todosProdutos = [];
  let todasSubcats  = [];
  let catAtiva      = null;
  let subcatAtiva   = null;

  // Banners por categoria
  const banners = {
    null:       { img: 'Inicio.png',    titulo: 'Realce sua essência',        sub: 'Perfumes sofisticados para todos os momentos' },
    feminino:   { img: 'Feminino.png',  titulo: 'Encante pelo cheiro',        sub: 'Para mulheres que deixam sua marca' },
    masculino:  { img: 'Masculino.png', titulo: 'A presença que conquista',   sub: 'Para homens que deixam sua marca' },
    kits:       { img: 'Kits.png',      titulo: 'Kits Perfumados',            sub: 'Presentes elegantes para todas as ocasiões' },
  };

  function atualizarBanner(tipo) {
    const b = banners[tipo] || banners[null];
    document.getElementById('banner-principal').style.backgroundImage = `url('${b.img}')`;
    document.getElementById('banner-titulo').textContent = b.titulo;
    document.getElementById('banner-sub').textContent   = b.sub;
  }

  async function init() {
    const [{ data: produtos }, { data: cats }, { data: subcats }] = await Promise.all([
      db.from('produtos')
        .select('id, nome, descricao, preco, imagem, desconto, subcategoria_id, subcategorias(id, nome, categoria_id, categorias(id, nome, tipo))')
        .eq('ativo', true)
        .order('criado_em', { ascending: false }),
      db.from('categorias').select('id, nome, tipo').eq('ativo', true).order('nome'),
      db.from('subcategorias').select('id, nome, tipo, categoria_id').eq('ativo', true).order('nome')
    ]);

    todosProdutos = produtos || [];
    todasSubcats  = subcats  || [];

    const filtrosCats = document.getElementById('filtros-cats');
    (cats || []).forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'btn-filtro';
      btn.textContent = cat.nome;
      btn.dataset.tipo = cat.tipo;
      btn.onclick = () => filtrarCategoria(cat, btn);
      filtrosCats.appendChild(btn);
    });

    renderizar();
    iniciarBusca();
  }

  function filtrarCategoria(cat, btnClicado) {
    catAtiva    = cat;
    subcatAtiva = null;
    document.querySelectorAll('.filtros-cats .btn-filtro').forEach(b => b.classList.remove('ativo'));
    btnClicado.classList.add('ativo');
    atualizarBanner(cat?.tipo || null);

    const filtrosSubcats = document.getElementById('filtros-subcats');
    filtrosSubcats.innerHTML = '';
    if (cat) {
      const subs = todasSubcats.filter(s => s.categoria_id === cat.id);
      if (subs.length > 0) {
        const btnTodas = document.createElement('button');
        btnTodas.className = 'btn-filtro subcat ativo';
        btnTodas.textContent = 'Todas';
        btnTodas.onclick = () => filtrarSubcat(null, btnTodas);
        filtrosSubcats.appendChild(btnTodas);
        subs.forEach(sub => {
          const btn = document.createElement('button');
          btn.className = 'btn-filtro subcat';
          btn.textContent = sub.nome;
          btn.onclick = () => filtrarSubcat(sub, btn);
          filtrosSubcats.appendChild(btn);
        });
      }
    }
    renderizar();
  }

  function filtrarSubcat(sub, btnClicado) {
    subcatAtiva = sub;
    document.querySelectorAll('.filtros-subcats .btn-filtro').forEach(b => b.classList.remove('ativo'));
    btnClicado.classList.add('ativo');
    renderizar();
  }

  function renderizar(listaOverride) {
    let lista = listaOverride ?? todosProdutos;
    if (!listaOverride) {
      if (catAtiva)   lista = lista.filter(p => p.subcategorias?.categorias?.id === catAtiva.id);
      if (subcatAtiva) lista = lista.filter(p => p.subcategoria_id === subcatAtiva.id);
    }

    const grid = document.getElementById('grid-produtos');
    document.getElementById('subtitulo-contagem').textContent =
      `${lista.length} perfume${lista.length !== 1 ? 's' : ''} disponíve${lista.length !== 1 ? 'is' : 'l'}`;

    if (lista.length === 0) {
      grid.innerHTML = '<div class="grid-status"><p>Nenhum produto encontrado.</p></div>';
      return;
    }

    grid.innerHTML = lista.map(p => renderCard(p)).join('');
    marcarFavoritos();
  }

  function renderCard(p) {
    const desconto     = p.desconto || 0;
    const precoOrig    = Number(p.preco);
    const precoFinal   = desconto > 0 ? precoOrig * (1 - desconto / 100) : precoOrig;
    const fmtBRL       = v => 'R$ ' + v.toFixed(2).replace('.', ',');
    const catNome      = p.subcategorias?.categorias?.nome || '';
    const subNome      = p.subcategorias?.nome || '';

    return `
      <div class="card">
        <div class="card-img-wrap" onclick="abrirModal(${p.id})" style="cursor:pointer">
          <div class="card-badges">
            ${catNome ? `<span class="card-badge">${catNome}</span>` : ''}
            ${subNome ? `<span class="card-badge sub">${subNome}</span>` : ''}
          </div>
          ${desconto > 0 ? `<span class="card-desconto-badge">-${desconto}%</span>` : ''}
          <img src="${p.imagem || ''}" alt="${p.nome}" onerror="this.style.display='none'">
        </div>
        <div class="card-info" onclick="abrirModal(${p.id})" style="cursor:pointer">
          <h3>${p.nome}</h3>
          <p class="desc">${p.descricao || ''}</p>
        </div>
        <div class="preco-row">
          <div class="preco-wrap">
            ${desconto > 0 ? `<span class="preco-original">${fmtBRL(precoOrig)}</span>` : ''}
            <span class="preco">${fmtBRL(precoFinal)}</span>
          </div>
          <button class="btn-fav" id="fav-${p.id}" onclick="toggleFav(this,${p.id})" title="Favoritar">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </div>
        <button class="card-comprar" onclick="abrirModal(${p.id})">Ver detalhes</button>
      </div>`;
  }

  function iniciarBusca() {
    const input   = document.getElementById('input-busca');
    const results = document.getElementById('search-results');
    let timer;

    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { results.classList.remove('visivel'); return; }
      timer = setTimeout(() => {
        const found = todosProdutos.filter(p =>
          p.nome.toLowerCase().includes(q.toLowerCase()) ||
          (p.descricao || '').toLowerCase().includes(q.toLowerCase())
        );
        results.innerHTML = found.length === 0
          ? '<p class="search-vazio">Nenhum perfume encontrado</p>'
          : found.slice(0, 6).map(p => {
              const desc = p.desconto || 0;
              const preco = Number(p.preco);
              const final = desc > 0 ? preco * (1 - desc / 100) : preco;
              const fmt = 'R$ ' + final.toFixed(2).replace('.', ',');
              return `
                <div class="search-result-item" onclick="abrirModal(${p.id}); document.getElementById('search-results').classList.remove('visivel'); document.getElementById('input-busca').value='';" style="cursor:pointer">
                  <img src="${p.imagem||''}" alt="${p.nome}" onerror="this.style.display='none'">
                  <div class="search-result-info">
                    <div class="search-result-nome">${p.nome}</div>
                    <div class="search-result-sub">${p.subcategorias?.nome||''}</div>
                    <div class="search-result-preco">${fmt}${desc > 0 ? ` <span style="color:#70c880;font-size:10px">-${desc}%</span>` : ''}</div>
                  </div>
                </div>`;
            }).join('');
        results.classList.add('visivel');
      }, 250);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.header-search')) results.classList.remove('visivel');
    });
  }

  init();
</script>
</body>
</html>
