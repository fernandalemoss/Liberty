<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masculino — Liberty Perfumaria</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>

<header>
  <div class="logo"><a href="index.html">Liberty Perfumaria</a></div>
  <div class="header-search">
    <input type="text" id="input-busca" placeholder="Buscar perfume..." autocomplete="off">
    <span class="search-icon">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <div class="search-results" id="search-results"></div>
  </div>
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="masculino.html">Masculino</a>
    <a href="masculino.html">Masculino</a>
    <a href="kits.html">Kits</a>
    <a href="sobrenos.html">Sobre Nós</a>
    <a id="link-acesso" href="login-cliente.html" class="link-entrar">Entrar</a>
  </nav>
</header>

<section class="banner banner-masculino">
  <div class="conteudo-banner">
    <h2>A presença que conquista</h2>
    <p>Para homens que deixam sua marca</p>
    <a href="https://wa.me/5599999999999" class="btn-banner" target="_blank">Falar no WhatsApp</a>
  </div>
</section>

<section class="produtos">
  <div class="secao-header">
    <div class="secao-header-left">
      <h2>Perfumes Masculinos</h2>
      <p id="subtitulo-contagem">Carregando...</p>
    </div>
    <div class="filtros-wrap">
      <div class="filtros-cats" id="filtros-subcats"></div>
    </div>
  </div>
  <div class="grid" id="grid-produtos">
    <div class="grid-status"><p>Carregando...</p></div>
  </div>
</section>

<footer>
  <span class="logo-footer">Liberty</span>
  <p>© 2025 Liberty Perfumaria · Divinópolis, MG</p>
</footer>

<div id="toast"></div>
<script src="favoritar.js"></script>
<script>
  let todosProdutos = [];
  let subcatAtiva   = null;

  async function init() {
    // Busca categoria masculino
    const { data: cat } = await db.from('categorias').select('id').eq('tipo', 'masculino').single();
    if (!cat) { document.getElementById('grid-produtos').innerHTML = '<div class="grid-status"><p>Categoria não encontrada.</p></div>'; return; }

    const [{ data: produtos }, { data: subcats }] = await Promise.all([
      db.from('produtos')
        .select('id, nome, descricao, preco, imagem, subcategoria_id, subcategorias(id, nome)')
        .eq('ativo', true)
        .order('criado_em', { ascending: false })
        .in('subcategoria_id',
          (await db.from('subcategorias').select('id').eq('categoria_id', cat.id)).data?.map(s => s.id) || []
        ),
      db.from('subcategorias').select('id, nome').eq('categoria_id', cat.id).eq('ativo', true).order('nome')
    ]);

    todosProdutos = produtos || [];

    // Monta filtros de subcategoria
    const wrap = document.getElementById('filtros-subcats');
    if (subcats && subcats.length > 0) {
      const btnTodas = document.createElement('button');
      btnTodas.className = 'btn-filtro ativo';
      btnTodas.textContent = 'Todas';
      btnTodas.onclick = () => filtrar(null, btnTodas);
      wrap.appendChild(btnTodas);

      subcats.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'btn-filtro';
        btn.textContent = sub.nome;
        btn.onclick = () => filtrar(sub, btn);
        wrap.appendChild(btn);
      });
    }

    renderizar(todosProdutos);
    iniciarBusca();
  }

  function filtrar(sub, btnClicado) {
    subcatAtiva = sub;
    document.querySelectorAll('#filtros-subcats .btn-filtro').forEach(b => b.classList.remove('ativo'));
    btnClicado.classList.add('ativo');
    renderizar(sub ? todosProdutos.filter(p => p.subcategoria_id === sub.id) : todosProdutos);
  }

  function renderizar(lista) {
    const grid      = document.getElementById('grid-produtos');
    const subtitulo = document.getElementById('subtitulo-contagem');
    subtitulo.textContent = `${lista.length} perfume${lista.length !== 1 ? 's' : ''} disponíve${lista.length !== 1 ? 'is' : 'l'}`;

    if (lista.length === 0) { grid.innerHTML = '<div class="grid-status"><p>Nenhum produto encontrado.</p></div>'; return; }

    const waBase = 'https://wa.me/5599999999999?text=';
    grid.innerHTML = lista.map(p => {
      const precoFmt = 'R$ ' + Number(p.preco).toFixed(2).replace('.', ',');
      const waLink   = waBase + encodeURIComponent(`Olá! Tenho interesse no perfume ${p.nome}.`);
      const subNome  = p.subcategorias?.nome || '';
      return `
        <div class="card">
          <div class="card-img-wrap">
            <div class="card-badges">
              <span class="card-badge">Masculino</span>
              ${subNome ? `<span class="card-badge sub">${subNome}</span>` : ''}
            </div>
            <img src="${p.imagem || ''}" alt="${p.nome}" onerror="this.style.display='none'">
          </div>
          <div class="card-info">
            <h3>${p.nome}</h3>
            <p class="desc">${p.descricao || ''}</p>
          </div>
          <div class="preco-row">
            <span class="preco">${precoFmt}</span>
            <button class="btn-fav" id="fav-${p.id}" onclick="toggleFav(this,${p.id})" title="Favoritar">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
          </div>
          <a href="${waLink}" class="card-comprar" target="_blank" rel="noopener noreferrer">Comprar via WhatsApp</a>
        </div>`;
    }).join('');
    marcarFavoritos();
  }

  function iniciarBusca() {
    const input   = document.getElementById('input-busca');
    const results = document.getElementById('search-results');
    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { results.classList.remove('visivel'); return; }
      timer = setTimeout(() => {
        const found = todosProdutos.filter(p => p.nome.toLowerCase().includes(q.toLowerCase()));
        results.innerHTML = found.length === 0
          ? '<p class="search-vazio">Nenhum perfume encontrado</p>'
          : found.slice(0,6).map(p => `
              <a class="search-result-item" href="https://wa.me/5599999999999?text=${encodeURIComponent(`Interesse no ${p.nome}`)}" target="_blank">
                <img src="${p.imagem||''}" alt="${p.nome}" onerror="this.style.display='none'">
                <div class="search-result-info">
                  <div class="search-result-nome">${p.nome}</div>
                  <div class="search-result-sub">${p.subcategorias?.nome||''}</div>
                  <div class="search-result-preco">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</div>
                </div>
              </a>`).join('');
        results.classList.add('visivel');
      }, 250);
    });
    document.addEventListener('click', e => { if (!e.target.closest('.header-search')) results.classList.remove('visivel'); });
  }

  init();
</script>
<script src="produto-modal.js"></script>
</body>
</html>
