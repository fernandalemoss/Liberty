<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Liberty Perfumaria</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    .perfil-hero {
      padding: 48px 48px 24px;
      border-bottom: 1px solid rgba(201,168,76,0.12);
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .perfil-hero h2 { font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:300; color:#c9a84c; letter-spacing:2px; }
    .perfil-hero p  { font-size:12px; color:rgba(237,224,200,0.4); margin-top:4px; letter-spacing:1px; }
    .btn-sair { background:transparent; border:1px solid rgba(201,168,76,0.25); color:rgba(201,168,76,0.7); padding:8px 18px; font-family:'Jost',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:.25s; }
    .btn-sair:hover { border-color:#c9a84c; color:#c9a84c; }
    .perfil-body { padding: 36px 48px; }
    .secao-titulo { font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:300; color:rgba(237,224,200,0.5); letter-spacing:3px; text-transform:uppercase; margin-bottom:24px; padding-bottom:12px; border-bottom:1px solid rgba(201,168,76,0.08); }
    .contador { font-size:11px; color:rgba(201,168,76,0.55); letter-spacing:2px; margin-bottom:20px; }
    .vazio { grid-column:1/-1; text-align:center; padding:80px 20px; color:rgba(237,224,200,0.25); }
    .vazio svg { width:40px; height:40px; margin:0 auto 16px; display:block; }
    .vazio p { font-size:15px; margin-bottom:12px; letter-spacing:1px; }
    .vazio a { color:#c9a84c; text-decoration:none; font-size:12px; letter-spacing:2px; }
    .btn-remover { display:flex; align-items:center; justify-content:center; gap:6px; background:transparent; border:1px solid rgba(237,224,200,0.07); color:rgba(237,224,200,0.28); padding:10px; width:calc(100% - 40px); margin:0 20px 12px; font-family:'Jost',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:.25s; }
    .btn-remover:hover { border-color:rgba(220,60,60,0.35); color:#e07070; }
  </style>
</head>
<body>

<header>
  <div class="logo"><a href="index.html">Liberty Perfumaria</a></div>
  <div class="header-search">
    <input type="text" id="input-busca" placeholder="Buscar perfume..." autocomplete="off">
    <span class="search-icon">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <div class="search-results" id="search-results"></div>
  </div>
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="feminino.html">Feminino</a>
    <a href="masculino.html">Masculino</a>
    <a href="kits.html">Kits</a>
    <a href="sobrenos.html">Sobre Nós</a>
    <a id="link-acesso" href="login-cliente.html" class="link-entrar">Entrar</a>
  </nav>
</header>

<div class="perfil-hero">
  <div>
    <h2 id="titulo-perfil">Meu Perfil</h2>
    <p id="subtitulo-perfil">Carregando...</p>
  </div>
  <button class="btn-sair" onclick="sair()">Sair</button>
</div>

<section class="perfil-body">
  <p class="secao-titulo">Favoritos</p>
  <p class="contador" id="contador"></p>
  <div class="grid" id="lista-favoritos">
    <p style="grid-column:1/-1;text-align:center;padding:40px;color:rgba(237,224,200,0.3)">Carregando...</p>
  </div>
</section>

<div id="toast"></div>

<script src="favoritar.js"></script>
<script>
  const dadosRaw = localStorage.getItem('liberty_sessao');
  if (!dadosRaw) { window.location.replace('login-cliente.html'); }
  const usuario = JSON.parse(dadosRaw);
  if (usuario.admin) { window.location.replace('admin.html'); }

  // Atualiza menu
  const linkAcesso = document.getElementById('link-acesso');
  if (linkAcesso) { linkAcesso.textContent = usuario.nome.split(' ')[0]; linkAcesso.href = 'perfil.html'; }

  document.getElementById('titulo-perfil').textContent   = `Olá, ${usuario.nome.split(' ')[0]}`;
  document.getElementById('subtitulo-perfil').textContent = usuario.email;

  async function carregarFavoritos() {
    // JOIN: favoritos → produtos → subcategorias → categorias
    const { data, error } = await db
      .from('favoritos')
      .select(`
        id, criado_em,
        produtos (
          id, nome, descricao, preco, imagem,
          subcategorias ( nome, categorias ( nome ) )
        )
      `)
      .eq('usuario_id', usuario.id)
      .order('criado_em', { ascending: false });

    const container = document.getElementById('lista-favoritos');
    const contador  = document.getElementById('contador');

    if (error) { container.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;color:#e07070">Erro ao carregar favoritos.</p>'; return; }

    const itens = (data || []).filter(f => f.produtos);

    contador.textContent = itens.length === 0
      ? 'Nenhum favorito salvo ainda'
      : `${itens.length} perfume${itens.length > 1 ? 's' : ''} salvo${itens.length > 1 ? 's' : ''}`;

    if (itens.length === 0) {
      container.innerHTML = `
        <div class="vazio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <p>Você ainda não salvou nenhum perfume</p>
          <a href="index.html">Explorar perfumes →</a>
        </div>`;
      return;
    }

    const waBase = 'https://wa.me/5599999999999?text=';
    container.innerHTML = itens.map(f => {
      const p        = f.produtos;
      const precoFmt = 'R$ ' + Number(p.preco).toFixed(2).replace('.', ',');
      const waLink   = waBase + encodeURIComponent(`Olá! Tenho interesse no perfume ${p.nome}.`);
      const catNome  = p.subcategorias?.categorias?.nome || '';
      const subNome  = p.subcategorias?.nome || '';

      return `
        <div class="card" id="fav-card-${f.id}">
          <div class="card-img-wrap">
            <div class="card-badges">
              ${catNome ? `<span class="card-badge">${catNome}</span>` : ''}
              ${subNome ? `<span class="card-badge sub">${subNome}</span>` : ''}
            </div>
            <img src="${p.imagem || ''}" alt="${p.nome}" onerror="this.style.display='none'">
          </div>
          <div class="card-info">
            <h3>${p.nome}</h3>
            <p class="desc">${p.descricao || ''}</p>
          </div>
          <div class="preco-row">
            <span class="preco">${precoFmt}</span>
          </div>
          <a href="${waLink}" class="card-comprar" target="_blank" rel="noopener noreferrer">
            Comprar via WhatsApp
          </a>
          <button class="btn-remover" onclick="remover(${f.id}, 'fav-card-${f.id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            Remover
          </button>
        </div>`;
    }).join('');
  }

  async function remover(favId, cardId) {
    const { error } = await db.from('favoritos').delete()
      .eq('id', favId).eq('usuario_id', usuario.id);
    if (!error) {
      const card = document.getElementById(cardId);
      if (card) { card.style.opacity = '0'; card.style.transition = '.3s'; }
      setTimeout(carregarFavoritos, 350);
    }
  }

  function sair() { localStorage.removeItem('liberty_sessao'); window.location.replace('index.html'); }

  carregarFavoritos();
</script>
</body>
</html>
